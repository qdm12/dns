name: Markdown
on:
  push:
    branches: [master]
    paths:
      - "**.md"
      - .github/workflows/markdown.yml
      - .markdownlint-cli2.jsonc
  pull_request:
    paths:
      - "**.md"
      - .github/workflows/markdown.yml
      - .markdownlint-cli2.jsonc

jobs:
  markdown:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v3

      - uses: DavidAnson/markdownlint-cli2-action@v21
        with:
          globs: "**.md"
          config: .markdownlint-cli2.jsonc

      - uses: reviewdog/action-misspell@v1
        with:
          locale: "US"
          level: error
          pattern: |
            *.md

      - uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: yes
          config-file: .github/workflows/configs/mlc-config.json

      - uses: peter-evans/dockerhub-description@v3
        if: github.repository == 'qdm12/dns' && github.event_name == 'push'
        with:
          username: qmcgaw
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
          repository: qmcgaw/dns
          short-description: DNS over TLS upstream server connected to DNS over TLS (IPv4 and IPv6) servers
          readme-filepath: README.md
